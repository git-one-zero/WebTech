<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

   <form> 
    <fieldset style="width: 23%;" >
        <legend >Signup</legend>
   <table align="center">
    <tr>
        <td><label for="user-name">User-name</label></td>
        <td><input id="user-name" type="text" required autofocus placeholder="user-name" 
    title="user-name" style="border-radius: 5px;"  ></td>
    </tr>
    <tr>
        <td><label for="password">Password:</label></td>
        <td><input id="password" type="password" required  placeholder="password" 
    title="password" style="border-radius: 5px;"  ></td>
    </tr>
    <tr>
       <td> <label for="re-enter">re-enter:</label></td>
       <td><input id="re-enter" type="password" required placeholder="re-enter" 
    title="re-enter" style="border-radius: 5px;" ></td>
    </tr>
    <tr><td colspan="2"><input type="checkbox" id="terms" required ><label for="terms">Agree Terms & Conditons</label></td></tr>
    <tr>
        <td><button>Signup</button></td>
        <td><button>Reset</button></td>
    </tr>
   </table>
   </fieldset>
   </form>

    

</body>
</html>
