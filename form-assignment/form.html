<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
            <form>
    <fieldset>
        <legend>Student details</legend>
        <h3>Personal Details</h3>

            <table>
                <tr>
                    <td><label for="first-name" >First Name</label></td>
                    <td><input type="text" required id="first-name" name="first-name " autofocus></td>
                </tr>
                    <tr>
                    <td><label for="last-name">Last Name</label></td>
                    <td><input type="text" required id="last-name" name="last-name "></td>
                </tr>
                <tr>
                    <td><label for="father-name">Father's Name</label></td>
                    <td><input type="text" required id="father-name" name="father-name" ></td>
                </tr>
                <tr>
                    <td><label for="mother-name">Mother's Name</label></td>
                    <td><input type="text" required id="mother-name" name="mother-name "></td>
                </tr>
                <tr>
                    <td><label for="dob">DOB</label></td>
                    <td><input type="date" required id="dob"></td>
                </tr>
                <tr>
                    <td><label>Gender</label></td>
                       <td><input type="radio"  id="male" name="gender" value="male"><label for="male">Male</label> 
                        <input type="radio"  id="female" name="gender" value="female"><label for="female">Female</label>
                        <input type="radio"  id="other" name="gender" value="other"><label for="other">Other</label></td>
                </tr>
                <tr>
                    <td><label for="blood-group">Blood Group</label></td>
                    <td><select name="blood" id="blood-group" >
                        <option selected disabled >select here...</option>
                        <option value="A+">A+</option>
                        <option value="A-" >A-</option>
                        <option value="B+" >B+</option>
                        <option value="B-"  >B-</option>
                        <option value="o+" >o+</option>
                        <option value="o-" >o-</option>
                        <option value="AB+" >AB+</option>
                        <option value="AB-" >AB-</option>
                    </select></td>
                </tr>
            </table>
                            <hr>
    </fieldset>
            </form>
</body>
</html>
